name: Deploy Quartz to Pages

# 自動發佈到 GitHub Pages（Quartz 官方 deploy workflow）
on:
  push:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Quartz
        run: npm ci

      - name: Build Quartz
        run: npx quartz build --output public

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_DIRECT_DEPLOY == 'true' && vars.CLOUDFLARE_PROJECT_NAME != '' && env.HAS_CLOUDFLARE_API_TOKEN == 'true' && env.HAS_CLOUDFLARE_ACCOUNT_ID == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/v4'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test public site
        if: ${{ vars.PUBLIC_SITE_URL != '' }}
        shell: bash
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PRIVATE_SMOKE_PATH: ${{ vars.PRIVATE_SMOKE_PATH }}
        run: |
          set -euo pipefail
          base="${PUBLIC_SITE_URL%/}"
          echo "Smoke testing $base"

          home_status="$(curl -L -s -o /tmp/home.html -w "%{http_code}" "$base/")"
          echo "home: $home_status"
          test "$home_status" -lt 400

          ask_status="$(curl -L -s -o /tmp/ask.json -w "%{http_code}" \
            -H "content-type: application/json" \
            --data '{"question":"財富自由是什麼？"}' \
            "$base/api/ask" || true)"
          echo "api/ask: $ask_status"
          test "$ask_status" -lt 500

          if [ -n "${PRIVATE_SMOKE_PATH:-}" ]; then
            private_url="$base/$PRIVATE_SMOKE_PATH"
            private_status="$(curl -L -s -o /tmp/private.html -w "%{http_code}" "$private_url" || true)"
            echo "private path: $private_status"
            if [ "$private_status" != "403" ] && [ "$private_status" != "404" ]; then
              echo "Private smoke path is public: $private_url"
              exit 1
            fi
          fi
